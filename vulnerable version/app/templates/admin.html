{% extends 'base.html' %}
{% block title %}Admin{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h2>All users (admin)</h2>
    <table>
      <thead><tr><th>ID</th><th>Username</th><th>Admin</th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.is_admin }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <p class="muted">Admin-only page.</p>
  </div>
</div>
{% endblock %}
